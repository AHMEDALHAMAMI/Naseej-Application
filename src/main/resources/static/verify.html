<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2F5444">
<script>try{var l=localStorage.getItem('naseej.lang');if(l!=='ar'&&l!=='en'){l=(navigator.language||'').toLowerCase().indexOf('ar')===0?'ar':'en';}document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';}catch(e){}</script>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
<title data-i18n-title="verify.title">Naseej</title>
</head>
<body>
<div class="auth">
  <aside class="auth-aside">
    <a class="brand" href="index.html" style="color:#fff" data-i18n-attr="aria-label:brand.home"><img src="assets/img/mark-white.png" alt=""><span data-i18n="brand.name">NASEEJ</span></a>
    <div class="stack" style="gap:18px">
      <h2 data-i18n-html="verify.asideTitle"></h2>
      <p data-i18n="verify.asideText"></p>
    </div>
    <span class="small" style="color:#C9D8CE" data-i18n="auth.asideFoot"></span>
    <img class="weave" src="assets/img/mark-white.png" alt="">
  </aside>
  <main class="auth-main" id="main">
    <div class="auth-top"><a class="btn btn-ghost btn-sm" href="index.html" data-i18n="auth.home"></a><span id="lang-slot"></span></div>
    <div class="auth-card">
      <div class="stack" style="gap:6px">
        <span class="eyebrow" data-i18n="verify.eyebrow"></span>
        <h1 data-i18n="verify.heading"></h1>
        <p class="muted" id="sent-to"></p>
      </div>
      <form id="otp-form" class="stack" novalidate>
        <div class="otp" id="otp" role="group" data-i18n-attr="aria-label:verify.codeLabel" dir="ltr"></div>
        <button class="btn btn-block" type="submit" data-i18n="verify.submit" data-i18n-attr="data-loading:verify.loading"></button>
      </form>
      <div class="row" style="justify-content:space-between">
        <button type="button" class="btn btn-ghost btn-sm" id="resend" data-i18n="verify.resend" data-i18n-attr="data-loading:verify.sending"></button>
        <a class="small" href="login.html" data-i18n="verify.back"></a>
      </div>
    </div>
  </main>
</div>
<script type="module" src="assets/js/pages/verify.js"></script>
</body>
</html>
