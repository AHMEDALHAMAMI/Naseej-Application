spring.application.name=Naseej

# API base path for @RestController / @Controller mappings
server.servlet.context-path=/api/v1

# MySQL (values from .env — see .env.example)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------- Security: JWT ----------
# JWT_SECRET must be at least 32 characters (HS256)
jwt.secret=${JWT_SECRET}
jwt.access-token-minutes=15
jwt.refresh-token-days=7
logging.level.org.springframework.security=DEBUG

# ---------- Email OTP ----------
otp.expiration-minutes=5
otp.max-attempts=5

# ---------- n8n (sends the OTP email through Gmail) ----------
# Leave empty in development: the code is printed in the console instead
n8n.webhook.otp-url=${N8N_OTP_WEBHOOK_URL:}
n8n.webhook.secret=${N8N_WEBHOOK_SECRET:}
# Platform events for alerts: IDEA_COMPLETED, CONTRACT_ACTIVE, CONTRACT_EXPIRED, PAYMENT_REFUNDED (empty = logged only)
n8n.webhook.events-url=${N8N_EVENTS_WEBHOOK_URL:}

# ---------- Contracts ----------
# Nightly check that terminates contracts past their 90-day opening deadline (Riyadh time)
app.contracts.expiry-cron=0 30 2 * * *

# ---------- Google OAuth2 ----------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# ---------- First admin (created on startup if missing) ----------
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ---------- Moyasar ----------
# Webhook: require matching X-Webhook-Secret when MOYASAR_WEBHOOK_SECRET is non-empty
moyasar.webhook.secret=${MOYASAR_WEBHOOK_SECRET:}
# REST API: Basic auth for GET /payments/get-status/{moyasarPaymentId}
moyasar.api.key=${MOYASAR_API_KEY:}
# Create Payment (sandbox): publishable key pk_test_* from Moyasar Settings
moyasar.api.publishable-key=${MOYASAR_PUBLISHABLE_KEY:}
# Browser return URL after 3DS (must be HTTPS in production; localhost ok for manual tests)
moyasar.callback.url=${MOYASAR_CALLBACK_URL:http://localhost:8080/api/v1/payments/moyasar-callback}

# ---------- Claude AI ----------
claude.api.key=${CLAUDE_API_KEY:}
claude.model=${CLAUDE_MODEL:claude-sonnet-5-5}

# ---------- Google Places ----------
google.places.api.key=${GOOGLE_PLACES_API_KEY:}

# ---------- Website map tiles ----------
# Optional MapTiler key (free at maptiler.com). Empty = OpenStreetMap tiles, no key needed
app.map.maptiler-key=${MAPTILER_API_KEY:}
app.map.style=${MAPTILER_STYLE:streets-v2}
# ---------- Demo data (created once on startup, see DemoDataSeeder) ----------
app.demo.enabled=${DEMO_DATA:true}

# ---------- Owner launch (an investor launching the idea they proposed) ----------
# The platform's one-time service fee in SAR before 15% VAT, paid by card (Moyasar) before the project starts.
# Empty or 0 = owner launches are closed.
app.owner-launch.fee-sar=${OWNER_LAUNCH_FEE_SAR:1500}
