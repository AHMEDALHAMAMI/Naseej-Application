spring.application.name=Naseej

# API base path for @RestController / @Controller mappings
spring.mvc.servlet.path=/api/v1

# MySQL (values from .env — see .env.example)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Claude AI (values from .env — see .env.example)
claude.api.key=${CLAUDE_API_KEY:}
claude.model=${CLAUDE_MODEL:claude-sonnet-5-5}

# Google Places (values from .env — see .env.example)
google.places.api.key=${GOOGLE_PLACES_API_KEY:}
