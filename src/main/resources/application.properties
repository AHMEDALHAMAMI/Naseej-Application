spring.application.name=Naseej

# API base path for @RestController / @Controller mappings
server.servlet.context-path=/api/v1

# MySQL (values from .env — see .env.example)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------- Security: JWT ----------
# JWT_SECRET must be at least 32 characters (HS256)
jwt.secret=${JWT_SECRET}
jwt.access-token-minutes=15
jwt.refresh-token-days=7

# ---------- Email OTP ----------
otp.expiration-minutes=5
otp.max-attempts=5

# ---------- n8n (sends the OTP email through Gmail) ----------
# Leave empty in development: the code is printed in the console instead
n8n.webhook.otp-url=${N8N_OTP_WEBHOOK_URL:}

# ---------- Google OAuth2 ----------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# ---------- First admin (created on startup if missing) ----------
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

