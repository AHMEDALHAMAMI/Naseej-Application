<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2F5444">
<script>try{var l=localStorage.getItem('naseej.lang');if(l!=='ar'&&l!=='en'){l=(navigator.language||'').toLowerCase().indexOf('ar')===0?'ar':'en';}document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';}catch(e){}</script>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/css/app.css">
<title data-i18n-title="register.title">Naseej</title>
</head>
<body>
<a class="sr-only" href="#main" data-i18n="common.skip">Skip to content</a>
<div class="auth">
  <aside class="auth-aside">
    <a class="brand" href="index.html" style="color:#fff" data-i18n-attr="aria-label:brand.home"><img src="assets/img/mark-white.png" alt=""><span data-i18n="brand.name">NASEEJ</span></a>
    <div class="stack" style="gap:18px">
      <h2 data-i18n-html="register.asideTitle"></h2>
      <p data-i18n="register.asideText"></p>
    </div>
    <span class="small" style="color:#C9D8CE" data-i18n="auth.asideFoot"></span>
    <img class="weave" src="assets/img/mark-white.png" alt="">
  </aside>
  <main class="auth-main" id="main">
    <div class="auth-top"><a class="btn btn-ghost btn-sm" href="index.html" data-i18n="auth.home"></a><span id="lang-slot"></span></div>
    <div class="auth-card wide">
      <div id="stepper"></div>
      <form id="register-form" class="stack" novalidate>

        <!-- Step 1: account type -->
        <section class="stack" data-step="0" aria-labelledby="h-type">
          <h1 id="h-type" tabindex="-1" data-i18n="signup.typeTitle"></h1>
          <fieldset class="stack" style="gap:12px;border:0;padding:0;margin:0">
            <legend class="sr-only" data-i18n="register.joiningAs"></legend>
            <label class="option">
              <input type="radio" name="role" value="RESIDENT" checked>
              <span class="badge" style="align-self:flex-start" data-i18n="choose.free"></span>
              <strong data-i18n="signup.resident"></strong>
              <span class="small muted" data-i18n="signup.residentText"></span>
            </label>
            <label class="option">
              <input type="radio" name="role" value="INVESTOR">
              <span class="badge badge-sand" style="align-self:flex-start" data-i18n="choose.crRequired"></span>
              <strong data-i18n="signup.investor"></strong>
              <span class="small muted" data-i18n="signup.investorText"></span>
            </label>
          </fieldset>
          <button type="button" class="btn btn-block" data-next data-i18n="signup.next"></button>
          <div class="divider-text" data-i18n="auth.orEmail"></div>
          <a class="btn google-btn btn-block" href="oauth2/authorization/google"><span class="g-icon" aria-hidden="true"></span><span data-i18n="register.google"></span></a>
          <p class="small muted"><span data-i18n="register.have"></span> <a href="login.html" data-i18n="register.login"></a></p>
        </section>

        <!-- Step 2: personal details -->
        <section class="stack" data-step="1" aria-labelledby="h-details" hidden>
          <h1 id="h-details" tabindex="-1" data-i18n="signup.stepDetails"></h1>
          <div class="field">
            <label for="fullName" data-i18n="form.fullName"></label>
            <input class="input" id="fullName" name="fullName" autocomplete="name" required minlength="3" maxlength="100">
            <span class="error" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="email" data-i18n="form.email"></label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" required dir="ltr">
            <span class="error" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="password" data-i18n="form.password"></label>
            <div class="password-wrap"><input class="input" id="password" name="password" type="password" autocomplete="new-password" required minlength="8" dir="ltr"></div>
            <span class="hint" data-i18n="form.passwordHint"></span>
            <span class="error" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="phone"><span data-i18n="form.mobile"></span> <span class="muted" data-i18n="form.optional"></span></label>
            <input class="input" id="phone" name="phone" type="tel" inputmode="numeric" data-i18n-attr="placeholder:signup.phonePh" autocomplete="tel" dir="ltr">
            <span class="error" aria-live="polite"></span>
          </div>
          <div class="row step-actions">
            <button type="button" class="btn btn-secondary" data-back data-i18n="signup.back"></button>
            <button type="button" class="btn" data-next data-i18n="signup.next"></button>
          </div>
        </section>

        <!-- Step 3 (resident): home address -->
        <section class="stack" data-step="2" data-role="RESIDENT" aria-labelledby="h-home" hidden>
          <div class="stack" style="gap:6px">
            <h1 id="h-home" tabindex="-1" data-i18n="addr.title"></h1>
            <p class="muted" data-i18n="addr.why"></p>
          </div>
          <div id="home-picker"></div>
          <div class="notice notice-info small"><span data-i18n="addr.rule"></span></div>
        </section>

        <!-- Step 3 (investor): company -->
        <section class="stack" data-step="2" data-role="INVESTOR" aria-labelledby="h-company" hidden>
          <h1 id="h-company" tabindex="-1" data-i18n="signup.companyTitle"></h1>
          <div class="field">
            <label for="companyName"><span data-i18n="acc.company"></span> <span class="muted" data-i18n="form.optional"></span></label>
            <input class="input" id="companyName" name="companyName" maxlength="120" autocomplete="organization">
            <span class="error" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="crNumber" data-i18n="inv.cr"></label>
            <input class="input" id="crNumber" name="crNumber" inputmode="numeric" maxlength="10" data-i18n-attr="placeholder:inv.crPlaceholder" dir="ltr">
            <span class="error" aria-live="polite"></span>
          </div>
          <div class="field">
            <div id="budget-range"></div>
            <span class="hint" data-i18n="signup.budgetHint"></span>
          </div>
          <div class="field">
            <span class="label" id="fields-label" data-i18n="inv.fields"></span>
            <div class="chips" role="group" aria-labelledby="fields-label" id="field-chips"></div>
            <input type="hidden" name="investmentFields">
            <span class="error" aria-live="polite"></span>
          </div>
          <div class="notice notice-warn"><span data-i18n-html="inv.reviewNote"></span></div>
        </section>

        <!-- Last step footer -->
        <div class="stack" data-final hidden>
          <div class="field">
            <label class="check"><input type="checkbox" id="terms" name="terms"><span data-i18n="form.terms"></span></label>
            <span class="error" aria-live="polite"></span>
          </div>
          <div class="row step-actions">
            <button type="button" class="btn btn-secondary" data-back data-i18n="signup.back"></button>
            <button class="btn" type="submit" data-i18n="register.submit" data-i18n-attr="data-loading:register.loading"></button>
          </div>
        </div>
      </form>
    </div>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="assets/js/pages/register.js"></script>
</body>
</html>
