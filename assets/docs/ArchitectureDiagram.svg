<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 910" width="1420" height="910" role="img" aria-labelledby="t d">
<title id="t">Naseej system architecture</title>
<desc id="d">The client calls the Spring Boot backend through Spring Security and JWT. Requests pass Controller, Service and Repository to MySQL. The Service calls Claude AI, Google Places and Nafath, starts payments with Moyasar and sends events to n8n. Moyasar sends payment webhooks to n8n, n8n calls the Controller back and sends WhatsApp alerts and Gmail emails.</desc>
